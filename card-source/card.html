<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1050px;height:600px;overflow:hidden;background:#f6f5f1}
.card{position:relative;width:1050px;height:600px;padding:64px 72px;display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:center;background:#f6f5f1;color:#16161a;font:400 18px/1.5 Inter,sans-serif}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:#e4572e}
.top{display:flex;align-items:center;gap:22px}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;filter:grayscale(1) contrast(1.05);border:1px solid #e2e0d9}
.eyebrow{font:500 13px/1 "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#6b6a66}
.name{margin:8px 0 0;font:400 84px/0.95 "Instrument Serif",serif}
.name em{color:#e4572e;font-style:normal}
.role{margin:28px 0 0;font-size:24px;font-weight:600}
.sub{margin:4px 0 0;color:#6b6a66;font-size:17px}
.contacts{margin:30px 0 0;padding:22px 0 0;border-top:1px solid #16161a;display:grid;gap:8px;font:500 16px/1.3 "JetBrains Mono",monospace}
.contacts span{color:#6b6a66;display:inline-block;width:92px}
.qrbox{background:#fff;border:1px solid #e2e0d9;border-radius:20px;padding:26px;text-align:center}
.qrbox img{width:100%;display:block}
.qrbox p{margin:18px 0 0;font:500 13px/1.3 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#6b6a66}
.qrbox strong{display:block;margin-top:4px;font:600 16px/1.3 Inter,sans-serif;letter-spacing:0;text-transform:none;color:#16161a}
</style></head><body>
<div class="card">
  <div>
    <div class="top">
      <img class="avatar" src="../profile-pic.png">
      <div><div class="eyebrow">Portfolio · Name card</div><h1 class="name">Naufal<em>.</em></h1></div>
    </div>
    <p class="role">Software Developer</p>
    <p class="sub">Laravel · CodeIgniter · WordPress · Backend</p>
    <div class="contacts">
      <div><span>Email</span>muh.naufal@hotmail.com</div>
      <div><span>LinkedIn</span>in/muhammad-naufal-200ok</div>
      <div><span>GitHub</span>github.com/naufalols</div>
    </div>
  </div>
  <div class="qrbox">
    <img src="qr.svg">
    <p>Scan to view portfolio<strong>naufalols.github.io</strong></p>
  </div>
</div>
</body></html>
